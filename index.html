eams"><meta name="theme-color" content="#0e1013"><link rel="manifest" id="mf">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#111418;--mu:#6b7280;--ln:#e3e6ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--card:#171a1f;--tx:#f1f3f5;--mu:#9aa1ab;--ln:#262a31}}
:root[data-theme="dark"]{--bg:#0e1013;--card:#171a1f;--tx:#f1f3f5;--mu:#9aa1ab;--ln:#262a31}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:22px;margin:0}
.bell{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font-size:14px}
.bell.on{background:#16a34a;border-color:#16a34a;color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:18px;padding:5px 12px 5px 6px;font-size:14px}
.chip.all{padding-left:12px}
.chip.a{background:var(--tx);color:var(--bg)}
.day{font-size:13px;color:var(--mu);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.g{background:linear-gradient(90deg,var(--card) 0%,var(--card) 30%,var(--c) 65%,var(--c) 100%);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.r{display:flex;gap:12px;align-items:center}
.b{flex:1;min-width:0}
.g .t{font-size:12px;color:var(--mu)}
.g .m{font-size:17px;font-weight:600;margin:2px 0}
.g .w{display:flex;justify-content:space-between;font-size:14px;color:var(--mu)}
.cd{color:var(--ct);font-weight:600}
.hm{width:16px;height:16px;vertical-align:-3px;margin-left:8px;color:var(--mu)}
.x{display:none;margin-top:10px;padding:10px 12px;background:var(--card);color:var(--tx);border-radius:8px;font-size:14px}
.g.o .x{display:block}
.x p{margin:0 0 6px}
.x a{color:var(--tx);margin-right:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0 10px}
.grid div{background:var(--bg);border-radius:8px;padding:8px 10px}
.grid small{display:block;color:var(--mu);font-size:12px}
.cn{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.nb{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:50%;width:36px;height:36px;font-size:18px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.dh{font-style:normal;text-align:center;font-size:12px;color:var(--mu)}
.dc{aspect-ratio:1/1.1;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;padding:3px;display:flex;flex-direction:column;align-items:center;font-size:13px;min-width:0}
.dc.s{outline:2px solid var(--tx)}
.dc.br{background:repeating-linear-gradient(135deg,rgba(128,128,128,.38) 0 5px,transparent 5px 10px),var(--card)}
.lg{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:2px}
</style></head><body><main>
<header><h1>My Teams</h1><button class="bell" id="bell">Notifications off</button></header>
<div class="chips" id="chips"></div>
<div id="list"></div>
</main>
